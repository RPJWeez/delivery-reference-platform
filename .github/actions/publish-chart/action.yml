name: Publish an immutable Helm chart
description: Reuse identical chart content; refuse a changed chart under an existing version.
inputs:
  chart: { required: true, description: Chart directory }
  registry:
    {
      required: true,
      description: "OCI registry parent path, e.g. ghcr.io/rpjweez/charts",
    }
  token: { required: true, description: Package publishing token }
outputs:
  package:
    value: ${{ steps.package.outputs.package }}
    description: Published chart archive for evidence
  digest:
    value: ${{ steps.package.outputs.digest }}
    description: Immutable OCI manifest digest
  reference:
    value: ${{ steps.package.outputs.reference }}
    description: Digest-addressed OCI reference
runs:
  using: composite
  steps:
    - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
      with: { version: v3.18.4 }
    - name: Publish or reuse identical content
      id: package
      shell: bash
      env:
        CHART: ${{ inputs.chart }}
        REGISTRY: ${{ inputs.registry }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        mkdir -p .work/charts/new .work/charts/existing
        echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        helm package "$CHART" --destination .work/charts/new
        archive=$(find .work/charts/new -name '*.tgz' -print -quit)
        name=$(helm show chart "$archive" | awk '/^name:/ {print $2}')
        version=$(helm show chart "$archive" | awk '/^version:/ {gsub(/"/, "", $2); print $2}')
        owner="${REGISTRY#ghcr.io/}"; owner="${owner%%/*}"
        package="${REGISTRY#ghcr.io/$owner/}/$name"
        endpoint="users/$owner/packages/container/${package//\//%2F}/versions?per_page=100"
        if gh api --paginate --slurp "$endpoint" > .work/charts/versions.json 2> .work/charts/lookup.err; then
          exists=$(jq --arg version "$version" '[.[][] | select(.metadata.container.tags | index($version))] | length' .work/charts/versions.json)
        elif grep -q 'HTTP 404' .work/charts/lookup.err; then
          exists=0
        else
          cat .work/charts/lookup.err >&2; exit 1
        fi
        if [[ "$exists" != 0 ]]; then
          helm pull "oci://$REGISTRY/$name" --version "$version" --destination .work/charts/existing
          existing=$(find .work/charts/existing -name '*.tgz' -print -quit)
          python3 - "$archive" "$existing" <<'PY'
        import sys, tarfile
        def content(path):
            with tarfile.open(path) as archive:
                return {f.name: archive.extractfile(f).read() for f in archive if f.isfile()}
        assert content(sys.argv[1]) == content(sys.argv[2]), 'Chart changed: increment its version instead of overwriting it'
        PY
          archive="$existing"
        else
          helm push "$archive" "oci://$REGISTRY"
        fi
        mkdir -p .work/charts/resolved
        helm pull "oci://$REGISTRY/$name" --version "$version" --destination .work/charts/resolved > .work/charts/resolved.log 2>&1
        digest=$(sed -n 's/^Digest: //p' .work/charts/resolved.log)
        [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { cat .work/charts/resolved.log; exit 1; }
        echo "package=$archive" >> "$GITHUB_OUTPUT"
        echo "digest=$digest" >> "$GITHUB_OUTPUT"
        echo "reference=$REGISTRY/$name@$digest" >> "$GITHUB_OUTPUT"
    - name: Extract published chart for SBOM inventory
      id: inventory
      shell: bash
      env:
        ARCHIVE: ${{ steps.package.outputs.package }}
      run: |
        set -euo pipefail
        mkdir -p .work/charts/sbom
        tar -xzf "$ARCHIVE" -C .work/charts/sbom
    - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
      with:
        path: .work/charts/sbom
        format: spdx-json
        output-file: .work/charts/chart.spdx.json
        upload-artifact: false
    - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
      with: { subject-path: "${{ steps.package.outputs.package }}" }
    - uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34
      with:
        {
          subject-path: "${{ steps.package.outputs.package }}",
          sbom-path: .work/charts/chart.spdx.json,
        }
    - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac
      with: { cosign-release: v3.1.4 }
    - name: Sign OCI chart digest
      shell: bash
      env:
        REFERENCE: ${{ steps.package.outputs.reference }}
        TOKEN: ${{ inputs.token }}
      run: |
        echo "$TOKEN" | cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        cosign sign --yes "$REFERENCE"
