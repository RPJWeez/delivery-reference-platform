name: Qualify a published application
description: Test the exact OCI candidate through one Argo CD Application in disposable kind.
inputs:
  reference:
    {
      required: true,
      description: Digest-addressed candidate OCI reference without scheme,
    }
  deployment-revision:
    {
      required: true,
      description: Commit containing the qualification environment values,
    }
  namespace:
    default: qualification
    description: Disposable application namespace
  application:
    default: qualification
    description: Argo Application name
  dependencies:
    required: true
    description: Application dependency provisioning script, relative to test repository
  test-command:
    required: true
    description: Application-owned qualification test command
  test-root:
    required: true
    description: Absolute path to the checked-out application test source
  test-revision:
    required: true
    description: Exact source commit containing the tests and dependency provisioning script
outputs:
  predicate:
    value: .work/qualification.json
    description: Qualification predicate to attest only after this action succeeds
runs:
  using: composite
  steps:
    - name: Verify exact application test checkout
      shell: bash
      env:
        TEST_ROOT: ${{ inputs.test-root }}
        TEST_REVISION: ${{ inputs.test-revision }}
      run: |
        set -euo pipefail
        test "$(git -C "$TEST_ROOT" rev-parse HEAD)" = "$TEST_REVISION"
        test -z "$(git -C "$TEST_ROOT" status --porcelain --untracked-files=normal)"
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with: { node-version: "22.22.0" }
    - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3
      with:
        {
          version: v0.31.0,
          cluster_name: "${{ inputs.namespace }}",
          wait: 120s,
        }
    - name: Install platform dependencies and pinned Argo CD
      shell: bash
      env:
        PLATFORM_ROOT: ${{ inputs.test-root }}
      run: |
        set -euo pipefail
        kubectl create namespace ${{ inputs.namespace }}
        cd "$PLATFORM_ROOT"
        QUALIFICATION_NAMESPACE="${{ inputs.namespace }}" bash "$PLATFORM_ROOT/${{ inputs.dependencies }}"
        kubectl create namespace argocd
        kubectl apply --server-side -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/94037c4d4e1af4bd0651d37a179fbd9e347e668c/manifests/core-install.yaml
        kubectl rollout status -n argocd deployment/argocd-repo-server --timeout=240s
        kubectl rollout status -n argocd statefulset/argocd-application-controller --timeout=240s
    - name: Reconcile exactly one application from the candidate digest
      shell: bash
      env:
        REFERENCE: ${{ inputs.reference }}
        DEPLOYMENT_REVISION: ${{ inputs.deployment-revision }}
      run: |
        set -euo pipefail
        [[ "$REFERENCE" =~ @sha256:[a-f0-9]{64}$ ]]
        kubectl apply -f bootstrap/project.yaml
        application=environments/qualification/application.yaml
        if [[ ! -f "$application" ]]; then application="$application.example"; fi
        kubectl create --dry-run=client -f "$application" -o json |
          jq --arg digest "${REFERENCE##*@}" --arg revision "$DEPLOYMENT_REVISION" \
            '.spec.sources[0].targetRevision = $digest | .spec.sources[1].targetRevision = $revision' |
          kubectl apply -f -
        kubectl wait -n argocd --for=jsonpath='{.status.sync.status}'=Synced application/${{ inputs.application }} --timeout=300s
        kubectl wait -n argocd --for=jsonpath='{.status.health.status}'=Healthy application/${{ inputs.application }} --timeout=300s
    - name: Application qualification tests
      shell: bash
      env:
        PLATFORM_ROOT: ${{ inputs.test-root }}
        QUALIFICATION_NAMESPACE: ${{ inputs.namespace }}
        TEST_COMMAND: ${{ inputs.test-command }}
      run: |
        set -euo pipefail
        cd "$PLATFORM_ROOT"
        bash -euo pipefail -c "$TEST_COMMAND"
    - name: Record exact qualification inputs
      shell: bash
      env:
        REFERENCE: ${{ inputs.reference }}
        DEPLOYMENT_REVISION: ${{ inputs.deployment-revision }}
        PLATFORM_ROOT: ${{ inputs.test-root }}
        TEST_REVISION: ${{ inputs.test-revision }}
        TEST_COMMAND: ${{ inputs.test-command }}
        DEPENDENCIES: ${{ inputs.dependencies }}
      run: |
        mkdir -p .work
        python3 - <<'PY'
        import json, os, platform
        from pathlib import Path
        root = Path(os.environ['PLATFORM_ROOT'])
        import subprocess
        revision = subprocess.check_output(['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip()
        assert revision == os.environ['TEST_REVISION'], 'test checkout must match declared revision'
        result = {'result': 'passed', 'candidate': os.environ['REFERENCE'],
                  'deploymentRevision': os.environ['DEPLOYMENT_REVISION'],
                  'testRevision': revision, 'testCommand': os.environ['TEST_COMMAND'],
                  'dependencies': os.environ['DEPENDENCIES'], 'architecture': platform.machine(),
                  'run': os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']}
        Path('.work/qualification.json').write_text(json.dumps(result, indent=2)+'\n')
        PY
    - name: Failure diagnostics
      if: failure()
      shell: bash
      run: |
        kubectl get applications -n argocd -o yaml || true
        kubectl get pods -A || true
        kubectl get events -n ${{ inputs.namespace }} --sort-by=.lastTimestamp || true
        kubectl logs -n argocd statefulset/argocd-application-controller --tail=100 || true
        kubectl logs -n ${{ inputs.namespace }} --all-containers --all-pods -l app.kubernetes.io/instance=${{ inputs.application }} --tail=100 || true
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: failure()
      with:
        name: functional-failure-evidence
        path: ${{ inputs.test-root }}/test-results
        retention-days: 14
        if-no-files-found: ignore
