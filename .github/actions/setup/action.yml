name: Pinned build toolchain
description: Install Java, Node, locked npm dependencies, and public dependency caches
runs:
  using: composite
  steps:
    - name: Load repository toolchain configuration
      id: config
      shell: bash
      run: node tools/pipeline/config.mjs
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: ${{ steps.config.outputs.javaVersion }}
        cache: maven
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ steps.config.outputs.nodeVersion }}
        cache: npm
    - shell: bash
      run: npm ci
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .nx/cache
        key: nx-${{ runner.os }}-${{ runner.arch }}-${{ github.ref }}-${{ github.sha }}-${{ github.run_attempt }}
        restore-keys: |
          nx-${{ runner.os }}-${{ runner.arch }}-${{ github.ref }}-
          nx-${{ runner.os }}-${{ runner.arch }}-refs/heads/main-
