name: Compose release candidate
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Immutable baseline candidate reference
        required: true
        type: string
      overrides:
        description: JSON component to candidate reference mapping
        default: "{}"
        type: string
      reason:
        description: Why this component combination is needed
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    uses: RPJWeez/pipelines/.github/workflows/package.yml@6cf88f781b64e97ea3fb71b22f13130d0426b044
    permissions:
      contents: read
      actions: read
      pull-requests: read
      packages: write
      id-token: write
      attestations: write
    with:
      operation: compose
      candidate: ${{ inputs.candidate }}
      overrides: ${{ inputs.overrides }}
      reason: ${{ inputs.reason }}
