name: Create dev package
on:
  workflow_dispatch:
    inputs:
      source-ref:
        type: string
        description: Branch to package
        required: true
permissions:
  contents: read
jobs:
  run:
    uses: RPJWeez/pipelines/.github/workflows/dev-package.yml@v1
    permissions:
      contents: read
      actions: read
      pull-requests: read
      packages: write
      id-token: write
      attestations: write
    with:
      source-ref: ${{ inputs.source-ref }}
