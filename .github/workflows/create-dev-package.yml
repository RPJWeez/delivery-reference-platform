name: Create dev package
on:
  workflow_dispatch:
    inputs:
      source-ref:
        description: Same-repository branch to package
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    uses: RPJWeez/pipelines/.github/workflows/package.yml@e6bb1233f06d30582189ab8a96179276257c242b
    permissions:
      contents: read
      actions: read
      pull-requests: read
      packages: write
      id-token: write
      attestations: write
    with:
      operation: dev
      source-ref: ${{ inputs.source-ref }}
      project-checks: "[]"
