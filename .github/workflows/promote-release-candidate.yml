name: Promote candidate to release
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Immutable qualified candidate reference
        required: true
        type: string
      release-id:
        description: Unique immutable release identifier
        required: true
        type: string
permissions:
  contents: read
jobs:
  promote:
    uses: RPJWeez/pipelines/.github/workflows/promote.yml@e6bb1233f06d30582189ab8a96179276257c242b
    permissions:
      contents: write
      actions: read
      pull-requests: read
      packages: write
      id-token: write
      attestations: write
    with:
      candidate: ${{ inputs.candidate }}
      release-id: ${{ inputs.release-id }}
