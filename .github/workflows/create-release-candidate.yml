name: Create release candidate
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  package:
    uses: RPJWeez/pipelines/.github/workflows/package.yml@bb4d1a5dc918d897bba812c146aec9ec29e9817f
    permissions:
      contents: read
      actions: read
      pull-requests: read
      packages: write
      id-token: write
      attestations: write
    with:
      operation: release
      project-checks: "[]"
