    uses: RPJWeez/pipelines/.github/workflows/package.yml@fab00a3f053d92a228c21744012720643cb5a751
    permissions:
      contents: read
      actions: read
      pull-requests: read
      packages: write
      id-token: write
      attestations: write
    with:
      operation: release
      project-checks: "[]"
