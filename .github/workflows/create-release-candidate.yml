name: Create release candidate
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  package:
    uses: RPJWeez/pipelines/.github/workflows/package.yml@6cf88f781b64e97ea3fb71b22f13130d0426b044
    permissions:
      contents: read
      actions: read
      pull-requests: read
      packages: write
      id-token: write
      attestations: write
    with:
      operation: release
      project-checks: "[]"
