name: Create release candidate
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  package:
    uses: RPJWeez/pipelines/.github/workflows/package.yml@f5a1930ea42b457df9120723ad650ca43eedd629
    permissions:
      contents: read
      actions: read
      pull-requests: read
      packages: write
      id-token: write
      attestations: write
    with:
      operation: release
      project-checks: "[]"
