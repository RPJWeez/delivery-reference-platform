name: Application CI
on:
  push:
    branches:
      - "**"
  pull_request: {}
  merge_group: {}
permissions:
  contents: read
jobs:
  delivery:
    uses: RPJWeez/pipelines/.github/workflows/validate.yml@v1
    permissions:
      contents: read
      actions: read
      pull-requests: read
    concurrency:
      group: validation-${{ github.ref }}
      cancel-in-progress: true
