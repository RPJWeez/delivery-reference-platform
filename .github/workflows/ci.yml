name: Application CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  delivery:
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
      attestations: write
    uses: RPJWeez/pipelines/.github/workflows/application.yml@4df67d87beef51203778754efe27cfc280111423
    with:
      chart: charts/fieldsignal
