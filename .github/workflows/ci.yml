name: Application CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  NX_DAEMON: "false"
  NX_NO_CLOUD: "true"
jobs:
  plan:
    name: Plan affected work
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      base: ${{ steps.select.outputs.base }}
      images: ${{ steps.select.outputs.images }}
      libraries: ${{ steps.select.outputs.libraries }}
      npm: ${{ steps.select.outputs.npm }}
      chart: ${{ steps.select.outputs.chart }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - name: Load publication configuration
        id: config
        run: node tools/pipeline/config.mjs
      - name: Select affected projects with Nx
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Include all changes since the last successful whole workflow, including failed publications.
          read -r base reason < <(bash tools/pipeline/select-base.sh)
          echo "Comparison baseline: $base ($reason); head: $GITHUB_SHA"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "images=$(npx nx show projects --affected --base="$base" --head="$GITHUB_SHA" --with-target=container --json)" >> "$GITHUB_OUTPUT"
          echo "libraries=$(npx nx show projects --affected --base="$base" --head="$GITHUB_SHA" --with-target=publish-maven --json)" >> "$GITHUB_OUTPUT"
          echo "npm=$(npx nx show projects --affected --base="$base" --head="$GITHUB_SHA" --projects=tag:type:npm-library --json)" >> "$GITHUB_OUTPUT"
          echo "java=$(npx nx show projects --affected --base="$base" --head="$GITHUB_SHA" --with-target=mvn-verify --json)" >> "$GITHUB_OUTPUT"
          echo "build=$(npx nx show projects --affected --base="$base" --head="$GITHUB_SHA" --with-target=build --json)" >> "$GITHUB_OUTPUT"
          echo "typecheck=$(npx nx show projects --affected --base="$base" --head="$GITHUB_SHA" --with-target=typecheck --json)" >> "$GITHUB_OUTPUT"
          echo "chart=$(npx nx show projects --affected --base="$base" --head="$GITHUB_SHA" --with-target=chart-package --json)" >> "$GITHUB_OUTPUT"
      - name: Explain affected selection
        env:
          BASE: ${{ steps.select.outputs.base }}
          BASE_REASON: ${{ steps.select.outputs.reason }}
          SELECTION: ${{ toJSON(steps.select.outputs) }}
        run: |
          mkdir -p .work
          npx nx graph --file=.work/graph.json
          node tools/pipeline/plan.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: results-plan
          path: .work/plan.json
          include-hidden-files: true

  validate:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Java — compile, test, package
            command: npx nx affected -t mvn-verify --parallel=2
          - name: Frontend — build and typecheck
            command: npx nx affected -t build typecheck --parallel=2
          - name: Pipeline and Helm regression tests
            command: npm run test:workspace
    env:
      NX_BASE: ${{ needs.plan.outputs.base }}
      NX_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - name: Load publication configuration
        id: config
        run: node tools/pipeline/config.mjs
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with: { version: v3.18.4 }
      - name: Execute validation
        id: check
        env:
          VALIDATION_COMMAND: ${{ matrix.command }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work
          bash -euo pipefail -c "$VALIDATION_COMMAND" 2>&1 | tee .work/validation.log
      - name: Lint Helm charts
        id: lint
        if: matrix.name == 'Pipeline and Helm regression tests'
        run: |
          for chart in $(npx nx show projects --with-target=chart-package --json | jq -r '.[]'); do
            root=$(npx nx show project "$chart" --json | jq -r .root)
            helm lint "$root" -f "$root/ci/values.yaml"
          done
      - name: Record validation result
        if: always()
        env:
          CHECK_NAME: ${{ matrix.name }}
          CHECK_RESULT: ${{ job.status }}
          LINT_RESULT: ${{ steps.lint.outcome }}
        run: node tools/pipeline/report.mjs validation "$CHECK_NAME" "$CHECK_RESULT" "$LINT_RESULT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: results-validation-${{ strategy.job-index }}
          path: .work/results
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: validation-${{ strategy.job-index }}
          path: |
            .work/validation.log
            **/target/surefire-reports/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  ci:
    name: Validation complete
    needs: [plan, validate]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful validation
        env:
          PLAN: ${{ needs.plan.result }}
          VALIDATION: ${{ needs.validate.result }}
        run: test "$PLAN" = success && test "$VALIDATION" = success

  publish-java:
    needs: [plan, ci]
    if: github.event_name == 'push' && needs.plan.outputs.libraries != '[]'
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - name: Load publication configuration
        id: config
        run: node tools/pipeline/config.mjs
      - name: Publish affected Maven components in dependency order
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NX_BASE: ${{ needs.plan.outputs.base }}
          NX_HEAD: ${{ github.sha }}
          NX_SKIP_NX_CACHE: "true"
        run: npx nx affected -t publish-maven --parallel=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: results-publish-java-${{ strategy.job-index || '0' }}
          path: .work/results
          include-hidden-files: true
          if-no-files-found: ignore

  java-evidence:
    needs: [plan, ci, publish-java]
    if: github.event_name == 'push' && needs.plan.outputs.libraries != '[]'
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.libraries) }}
    uses: ./.github/workflows/java-evidence.yml
    with: { project: "${{ matrix.project }}" }
    permissions:
      { contents: write, packages: read, id-token: write, attestations: write }

  publish-npm:
    needs: [plan, ci]
    if: github.event_name == 'push' && needs.plan.outputs.npm != '[]'
    runs-on: ubuntu-24.04
    permissions:
      { contents: write, packages: write, id-token: write, attestations: write }
    strategy:
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.npm) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup
      - name: Load publication configuration
        id: config
        run: node tools/pipeline/config.mjs
      - name: Build and pack selected package
        id: package
        env: { PROJECT: "${{ matrix.project }}" }
        run: |
          npx nx build "$PROJECT" --skip-nx-cache
          root=$(npx nx show project "$PROJECT" --json | jq -r .root)
          mkdir -p .work/packages
          npm pack "./$root" --pack-destination .work/packages
          echo "root=$root" >> "$GITHUB_OUTPUT"
      - name: Publish immutable npm version
        id: publish
        env:
          {
            NODE_AUTH_TOKEN: "${{ github.token }}",
            ROOT: "${{ steps.package.outputs.root }}",
          }
        run: |
          set -euo pipefail
          name=$(jq -r .name "$ROOT/package.json")
          version=$(jq -r .version "$ROOT/package.json")
          echo "Package: $name@$version; destination: ${{ steps.config.outputs.npmRegistry }}"
          actual="sha512-$(openssl dgst -sha512 -binary .work/packages/*.tgz | openssl base64 -A)"
          echo "integrity=$actual" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" dist.integrity --json > .work/integrity.json 2> .work/npm-lookup.err; then
            [[ "$actual" == "$(jq -r . .work/integrity.json)" ]] || { echo 'Package changed: bump its version'; exit 1; }
            echo "outcome=reused" >> "$GITHUB_OUTPUT"
          elif grep -q E404 .work/npm-lookup.err; then
            echo "outcome=published" >> "$GITHUB_OUTPUT"
            npm publish .work/packages/*.tgz --registry="${{ steps.config.outputs.npmRegistry }}" --access=public --ignore-scripts
          else
            cat .work/npm-lookup.err >&2; exit 1
          fi
      - name: Record package publication before evidence generation
        env:
          PROJECT: ${{ matrix.project }}
          ROOT: ${{ steps.package.outputs.root }}
          OUTCOME: ${{ steps.publish.outputs.outcome }}
          INTEGRITY: ${{ steps.publish.outputs.integrity }}
          REGISTRY: ${{ steps.config.outputs.npmRegistry }}
        run: |
          version=$(jq -r .version "$ROOT/package.json")
          node tools/pipeline/report.mjs record "$PROJECT" npm "$OUTCOME" "$REGISTRY/$PROJECT" "$version" "$INTEGRITY" "evidence generation pending"
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          {
            path: .work/packages,
            format: spdx-json,
            output-file: .work/npm.spdx.json,
            upload-artifact: false,
          }
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with: { subject-path: ".work/packages/*.tgz" }
      - uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34
        with:
          {
            subject-path: ".work/packages/*.tgz",
            sbom-path: .work/npm.spdx.json,
          }
      - name: Retain package and SBOM as release evidence
        env:
          {
            GH_TOKEN: "${{ github.token }}",
            ROOT: "${{ steps.package.outputs.root }}",
          }
        run: |
          version=$(jq -r .version "$ROOT/package.json")
          name=$(jq -r .name "$ROOT/package.json")
          tag="${name//@/}-v$version"; tag="${tag//\//-}"
          sbom=".work/packages/${tag}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.spdx.json"
          cp .work/npm.spdx.json "$sbom"
          bash tools/pipeline/retain-release.sh "$tag" .work/packages/*.tgz "$sbom"
          node tools/pipeline/report.mjs record "$name" npm "${{ steps.publish.outputs.outcome }}" "${{ steps.config.outputs.npmRegistry }}/$name" "$version" "${{ steps.publish.outputs.integrity }}" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: results-publish-npm-${{ strategy.job-index || '0' }}
          path: .work/results
          include-hidden-files: true
          if-no-files-found: ignore

  publish-images:
    needs: [plan, ci, publish-java, java-evidence, publish-npm]
    if: >-
      always() && github.event_name == 'push' && needs.ci.result == 'success'
      && needs.plan.outputs.images != '[]'
      && contains(fromJSON('["success","skipped"]'), needs.publish-java.result)
      && contains(fromJSON('["success","skipped"]'), needs.publish-npm.result)
      && contains(fromJSON('["success","skipped"]'), needs.java-evidence.result)
    runs-on: ubuntu-24.04
    permissions:
      { contents: write, packages: write, id-token: write, attestations: write }
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup
      - name: Load publication configuration
        id: config
        run: node tools/pipeline/config.mjs
      - name: Resolve project and build against published dependencies
        id: component
        env:
          PROJECT: ${{ matrix.project }}
          GITHUB_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root=$(npx nx show project "$PROJECT" --json | jq -r .root)
          name=$(basename "$root")
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/$name" >> "$GITHUB_OUTPUT"
          if [[ -f "$root/pom.xml" ]]; then
            ./mvnw -B -ntp -Ppublished-dependencies -pl "$PROJECT" -DskipTests package
          else
            # A nested node_modules resolves the registry UI package, not the
            # workspace symlink. Build tooling remains locked by the root npm ci.
            npm install --prefix "$root" --workspaces=false --package-lock=false --ignore-scripts --no-save
            npm run build --workspace "$PROJECT"
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          {
            registry: ghcr.io,
            username: "${{ github.actor }}",
            password: "${{ github.token }}",
          }
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: image
        with:
          context: .
          file: ${{ steps.component.outputs.root }}/Dockerfile
          push: true
          platforms: ${{ steps.config.outputs.imagePlatforms }}
          tags: ${{ steps.component.outputs.image }}:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: true
      - name: Record image publication before evidence generation
        env:
          PROJECT: ${{ matrix.project }}
          IMAGE: ${{ steps.component.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: node tools/pipeline/report.mjs record "$PROJECT" image published "$IMAGE" "" "$DIGEST" "evidence generation pending"
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ steps.component.outputs.image }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: image.spdx.json
          upload-artifact: false
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          {
            subject-name: "${{ steps.component.outputs.image }}",
            subject-digest: "${{ steps.image.outputs.digest }}",
            push-to-registry: true,
          }
      - uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34
        with:
          {
            subject-name: "${{ steps.component.outputs.image }}",
            subject-digest: "${{ steps.image.outputs.digest }}",
            sbom-path: image.spdx.json,
            push-to-registry: true,
          }
      - uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with: { cosign-release: v3.1.4 }
      - name: Sign image digest
        env:
          {
            IMAGE: "${{ steps.component.outputs.image }}",
            DIGEST: "${{ steps.image.outputs.digest }}",
          }
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Published component
        env:
          {
            IMAGE: "${{ steps.component.outputs.image }}",
            DIGEST: "${{ steps.image.outputs.digest }}",
            PROJECT: "${{ matrix.project }}",
          }
        run: |
          mv image.spdx.json "${IMAGE##*/}.spdx.json"
          GH_TOKEN="${{ github.token }}" bash tools/pipeline/retain-release.sh "image-${IMAGE##*/}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "${IMAGE##*/}.spdx.json"
          node tools/pipeline/report.mjs record "$PROJECT" image published "$IMAGE" "" "$DIGEST" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/image-${IMAGE##*/}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: results-publish-images-${{ strategy.job-index || '0' }}
          path: .work/results
          include-hidden-files: true
          if-no-files-found: ignore

  publish-chart:
    strategy:
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.chart) }}
    needs: [plan, ci]
    if: github.event_name == 'push' && needs.plan.outputs.chart != '[]'
    runs-on: ubuntu-24.04
    permissions:
      { contents: write, packages: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup
      - name: Load publication configuration
        id: config
        run: node tools/pipeline/config.mjs
      - name: Resolve chart location
        id: location
        env: { PROJECT: "${{ matrix.project }}" }
        run: echo "root=$(npx nx show project "$PROJECT" --json | jq -r .root)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/publish-chart
        id: chart
        with:
          {
            project: "${{ matrix.project }}",
            chart: "${{ steps.location.outputs.root }}",
            registry: "ghcr.io/${{ github.repository_owner }}/${{ steps.config.outputs.chartRegistryPath }}",
            token: "${{ github.token }}",
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: results-publish-chart-${{ strategy.job-index || '0' }}
          path: .work/results
          include-hidden-files: true
          if-no-files-found: ignore

  report:
    name: Run report
    permissions:
      contents: read
      actions: read
    needs:
      [
        plan,
        validate,
        ci,
        publish-java,
        java-evidence,
        publish-npm,
        publish-images,
        publish-chart,
      ]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: results-*
          path: .work/results
      - name: Read individual check results and log links
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .work
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100&filter=latest" --jq '{jobs: [.[].jobs[]]}' > .work/jobs.json
      - name: Render actual execution results
        if: always()
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: node tools/pipeline/report.mjs summary --github-summary
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: run-report
          path: |
            .work/run-report.json
            .work/summary.md
          include-hidden-files: true
