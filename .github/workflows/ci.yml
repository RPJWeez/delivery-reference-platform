name: Application CI
on:
  push:
    branches:
      - "**"
  pull_request: {}
  merge_group: {}
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  delivery:
    uses: RPJWeez/pipelines/.github/workflows/validate.yml@bb4d1a5dc918d897bba812c146aec9ec29e9817f
    permissions:
      contents: read
      actions: read
      pull-requests: read
    with:
      deduplicate: true
      chart: charts/fieldsignal
      project-checks: "[]"
