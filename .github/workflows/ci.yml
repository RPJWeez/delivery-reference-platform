name: Application CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  delivery:
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
      attestations: write
    uses: RPJWeez/pipelines/.github/workflows/application.yml@22cc7b8c54fbc5c543c163c0a8f6bb0ca1388a76
    with:
      chart: charts/fieldsignal
