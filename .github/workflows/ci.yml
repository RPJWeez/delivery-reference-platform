name: FieldSignal CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: fieldsignal-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  NX_DAEMON: "false"
  NX_NO_CLOUD: "true"
jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      base: ${{ steps.select.outputs.base }}
      images: ${{ steps.select.outputs.images }}
      libraries: ${{ steps.select.outputs.libraries }}
      npm: ${{ steps.select.outputs.npm }}
      chart: ${{ steps.select.outputs.chart }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - name: Select affected projects with Nx
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base="$PR_BASE"
          if [[ -z "$base" ]]; then
            base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')
          fi
          # Bootstrap compares against an empty tree. Subsequent publication compares
          # against the last successful whole workflow, so a failed publish is retried.
          if [[ -z "$base" ]]; then base=$(git hash-object -t tree /dev/null); fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "images=$(npx nx show projects --affected --base="$base" --head="$GITHUB_SHA" --with-target=container --json)" >> "$GITHUB_OUTPUT"
          echo "libraries=$(npx nx show projects --affected --base="$base" --head="$GITHUB_SHA" --with-target=publish-maven --json)" >> "$GITHUB_OUTPUT"
          echo "npm=$(npx nx show projects --affected --base="$base" --head="$GITHUB_SHA" --projects=tag:type:npm-library --json)" >> "$GITHUB_OUTPUT"
          echo "chart=$(npx nx show projects --affected --base="$base" --head="$GITHUB_SHA" --with-target=chart-package --json)" >> "$GITHUB_OUTPUT"
      - name: Affected component builds and tests
        env:
          NX_BASE: ${{ steps.select.outputs.base }}
          NX_HEAD: ${{ github.sha }}
        run: npx nx affected -t mvn-verify build typecheck --parallel=2
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with: { version: v3.18.4 }
      - name: Verify dependency selection and chart behavior
        run: npm run test:workspace
      - name: Lint chart
        run: helm lint charts/application -f charts/application/ci/values.yaml

  publish-java:
    needs: ci
    if: github.event_name == 'push' && needs.ci.outputs.libraries != '[]'
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - name: Publish affected Maven components in dependency order
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NX_BASE: ${{ needs.ci.outputs.base }}
          NX_HEAD: ${{ github.sha }}
          NX_SKIP_NX_CACHE: "true"
        run: npx nx affected -t publish-maven --parallel=1
  java-evidence:
    needs: [ci, publish-java]
    if: github.event_name == 'push' && needs.ci.outputs.libraries != '[]'
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.ci.outputs.libraries) }}
    uses: ./.github/workflows/java-evidence.yml
    with: { project: "${{ matrix.project }}" }
    permissions:
      { contents: write, packages: read, id-token: write, attestations: write }

  publish-npm:
    needs: ci
    if: github.event_name == 'push' && needs.ci.outputs.npm != '[]'
    runs-on: ubuntu-24.04
    permissions:
      { contents: write, packages: write, id-token: write, attestations: write }
    strategy:
      matrix:
        project: ${{ fromJSON(needs.ci.outputs.npm) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup
      - name: Build and pack selected package
        id: package
        env: { PROJECT: "${{ matrix.project }}" }
        run: |
          npx nx build "$PROJECT" --skip-nx-cache
          root=$(npx nx show project "$PROJECT" --json | jq -r .root)
          mkdir -p .work/packages
          npm pack "./$root" --pack-destination .work/packages
          echo "root=$root" >> "$GITHUB_OUTPUT"
      - name: Publish immutable npm version
        env:
          {
            NODE_AUTH_TOKEN: "${{ github.token }}",
            ROOT: "${{ steps.package.outputs.root }}",
          }
        run: |
          set -euo pipefail
          name=$(jq -r .name "$ROOT/package.json")
          version=$(jq -r .version "$ROOT/package.json")
          if npm view "$name@$version" dist.integrity --json > .work/integrity.json 2> .work/npm-lookup.err; then
            actual="sha512-$(openssl dgst -sha512 -binary .work/packages/*.tgz | openssl base64 -A)"
            [[ "$actual" == "$(jq -r . .work/integrity.json)" ]] || { echo 'Package changed: bump its version'; exit 1; }
          elif grep -q E404 .work/npm-lookup.err; then
            npm publish .work/packages/*.tgz --registry=https://npm.pkg.github.com --access=public --ignore-scripts
          else
            cat .work/npm-lookup.err >&2; exit 1
          fi
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          {
            path: .work/packages,
            format: spdx-json,
            output-file: .work/npm.spdx.json,
            upload-artifact: false,
          }
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with: { subject-path: ".work/packages/*.tgz" }
      - uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34
        with:
          {
            subject-path: ".work/packages/*.tgz",
            sbom-path: .work/npm.spdx.json,
          }
      - name: Retain package and SBOM as release evidence
        env:
          {
            GH_TOKEN: "${{ github.token }}",
            ROOT: "${{ steps.package.outputs.root }}",
          }
        run: |
          version=$(jq -r .version "$ROOT/package.json")
          if ! gh release view "ui-v$version" >/dev/null 2>&1; then
            gh release create "ui-v$version" .work/packages/*.tgz .work/npm.spdx.json --target "$GITHUB_SHA" --title "UI $version" --notes "Immutable UI package; provenance and SBOM attestations are available through gh attestation verify."
          fi

  publish-images:
    needs: [ci, publish-java, java-evidence, publish-npm]
    if: >-
      always() && github.event_name == 'push' && needs.ci.result == 'success'
      && needs.ci.outputs.images != '[]'
      && contains(fromJSON('["success","skipped"]'), needs.publish-java.result)
      && contains(fromJSON('["success","skipped"]'), needs.publish-npm.result)
      && contains(fromJSON('["success","skipped"]'), needs.java-evidence.result)
    runs-on: ubuntu-24.04
    permissions:
      { contents: read, packages: write, id-token: write, attestations: write }
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.ci.outputs.images) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup
      - name: Resolve project and build against published dependencies
        id: component
        env:
          PROJECT: ${{ matrix.project }}
          GITHUB_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root=$(npx nx show project "$PROJECT" --json | jq -r .root)
          name=$(basename "$root")
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/$name" >> "$GITHUB_OUTPUT"
          if [[ -f "$root/pom.xml" ]]; then
            ./mvnw -B -ntp -Ppublished-dependencies -pl "$PROJECT" -DskipTests package
          else
            # A nested node_modules resolves the registry UI package, not the
            # workspace symlink. Build tooling remains locked by the root npm ci.
            npm install --prefix "$root" --workspaces=false --package-lock=false --ignore-scripts --no-save
            npm run build --workspace "$PROJECT"
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          {
            registry: ghcr.io,
            username: "${{ github.actor }}",
            password: "${{ github.token }}",
          }
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: image
        with:
          context: .
          file: ${{ steps.component.outputs.root }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.component.outputs.image }}:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: true
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ steps.component.outputs.image }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: image.spdx.json
          upload-artifact: false
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          {
            subject-name: "${{ steps.component.outputs.image }}",
            subject-digest: "${{ steps.image.outputs.digest }}",
            push-to-registry: true,
          }
      - uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34
        with:
          {
            subject-name: "${{ steps.component.outputs.image }}",
            subject-digest: "${{ steps.image.outputs.digest }}",
            sbom-path: image.spdx.json,
            push-to-registry: true,
          }
      - uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with: { cosign-release: v3.1.4 }
      - name: Sign image digest
        env:
          {
            IMAGE: "${{ steps.component.outputs.image }}",
            DIGEST: "${{ steps.image.outputs.digest }}",
          }
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Published component
        env:
          {
            IMAGE: "${{ steps.component.outputs.image }}",
            DIGEST: "${{ steps.image.outputs.digest }}",
          }
        run: echo "$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  publish-chart:
    needs: ci
    if: github.event_name == 'push' && needs.ci.outputs.chart != '[]'
    runs-on: ubuntu-24.04
    permissions:
      { contents: read, packages: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/publish-chart
        id: chart
        with:
          {
            chart: charts/application,
            registry: ghcr.io/rpjweez/charts,
            token: "${{ github.token }}",
          }
