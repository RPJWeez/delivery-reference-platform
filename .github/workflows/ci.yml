name: FieldSignal CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  impact:
    runs-on: ubuntu-24.04
    outputs:
      services: ${{ steps.select.outputs.services }}
      web: ${{ steps.select.outputs.web }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 tools/ci_impact.py
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Policy tests
        run: python3 -m unittest discover -s tests -v
      - name: Check release fixture
        run: python3 tools/delivery.py validate releases/examples/sensing.json
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.18.4
      - name: Render chart with Helm 3
        run: |
          set -euo pipefail
          helm version --short | grep '^v3\.'
          helm lint charts/application
          python3 tools/delivery.py values releases/examples/sensing.json > /tmp/values.json
          helm template sensing charts/application -f /tmp/values.json > /tmp/rendered.yaml
  java:
    needs: impact
    if: needs.impact.outputs.services != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.impact.outputs.services) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test service and build-time dependencies
        env:
          SERVICE: ${{ matrix.service }}
        run: mvn --batch-mode --no-transfer-progress -pl "apps/$SERVICE" -am verify
  web:
    needs: impact
    if: needs.impact.outputs.web == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
  integration:
    needs: impact
    if: needs.impact.outputs.services != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - run: make infra
      - name: Exercise real PostgreSQL and Kafka
        shell: bash
        run: |
          set -euo pipefail
          java -jar apps/ingestion-service/target/ingestion-service-0.1.0-SNAPSHOT.jar > /tmp/ingestion.log 2>&1 &
          ingestion_pid=$!
          java -jar apps/incident-service/target/incident-service-0.1.0-SNAPSHOT.jar > /tmp/incident.log 2>&1 &
          incident_pid=$!
          trap 'kill "$ingestion_pid" "$incident_pid" 2>/dev/null || true' EXIT
          curl --fail --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8081/actuator/health/readiness
          curl --fail --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8082/actuator/health/readiness
          make smoke
      - name: Failure diagnostics
        if: failure()
        run: |
          cat /tmp/ingestion.log /tmp/incident.log 2>/dev/null || true
          docker compose -f infra/local/compose.yaml logs --tail=100
      - name: Stop infrastructure
        if: always()
        run: make infra-down
  ci:
    if: always()
    needs: [impact, policy, java, web, integration]
    runs-on: ubuntu-24.04
    steps:
      - name: Stable required check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert all(job['result'] in ('success', 'skipped') for job in results.values()), results
          assert results['impact']['result'] == results['policy']['result'] == 'success', results
          PY
