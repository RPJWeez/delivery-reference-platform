name: Application CI
on:
  push:
    branches:
      - "**"
  pull_request: {}
  merge_group: {}
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  delivery:
    uses: RPJWeez/pipelines/.github/workflows/validate.yml@f5a1930ea42b457df9120723ad650ca43eedd629
    permissions:
      contents: read
      actions: read
      pull-requests: read
    with:
      deduplicate: true
      chart: charts/fieldsignal
      project-checks: "[]"
