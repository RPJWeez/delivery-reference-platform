name: Application CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  NX_DAEMON: "false"
  NX_NO_CLOUD: "true"
jobs:
  plan:
    name: Plan affected work
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      base: ${{ steps.select.outputs.base }}
      images: ${{ steps.select.outputs.images }}
      chart: ${{ steps.select.outputs.chart }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - name: Load build configuration
        id: config
        run: node tools/pipeline/config.mjs
      - name: Select affected projects with Nx
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Include all changes since the last successful whole workflow, including failed publications.
          read -r base reason < <(bash tools/pipeline/select-base.sh)
          echo "Comparison baseline: $base ($reason); head: $GITHUB_SHA"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "images=$(docker buildx bake --print application | jq -c .group.application.targets)" >> "$GITHUB_OUTPUT"
          echo "java=$(npx nx show projects --affected --base="$base" --head="$GITHUB_SHA" --with-target=mvn-verify --json)" >> "$GITHUB_OUTPUT"
          echo "build=$(npx nx show projects --affected --base="$base" --head="$GITHUB_SHA" --with-target=build --json)" >> "$GITHUB_OUTPUT"
          echo "typecheck=$(npx nx show projects --affected --base="$base" --head="$GITHUB_SHA" --with-target=typecheck --json)" >> "$GITHUB_OUTPUT"
          echo 'chart=["application-candidate"]' >> "$GITHUB_OUTPUT"
      - name: Explain affected selection
        env:
          BASE: ${{ steps.select.outputs.base }}
          BASE_REASON: ${{ steps.select.outputs.reason }}
          SELECTION: ${{ toJSON(steps.select.outputs) }}
        run: |
          mkdir -p .work
          npx nx graph --file=.work/graph.json
          node tools/pipeline/plan.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: results-plan
          path: .work/plan.json
          include-hidden-files: true

  validate:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Java — compile, test, package
            command: test "$(npx nx show projects --affected --with-target=mvn-verify --json)" = '[]' || npx nx run fieldsignal:java-verify
          - name: Frontend — build and typecheck
            command: npx nx affected -t build typecheck --parallel=2
          - name: Pipeline and Helm regression tests
            command: npm run test:workspace
    env:
      NX_BASE: ${{ needs.plan.outputs.base }}
      NX_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
        with: { cache-scope: "validation-${{ strategy.job-index }}" }
      - name: Load build configuration
        id: config
        run: node tools/pipeline/config.mjs
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with: { version: v3.18.4 }
      - name: Execute validation
        id: check
        env:
          VALIDATION_COMMAND: ${{ matrix.command }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work
          bash -euo pipefail -c "$VALIDATION_COMMAND" 2>&1 | tee .work/validation.log
      - name: Lint Helm charts
        id: lint
        if: matrix.name == 'Pipeline and Helm regression tests'
        run: |
          for chart in $(npx nx show projects --with-target=chart-package --json | jq -r '.[]'); do
            root=$(npx nx show project "$chart" --json | jq -r .root)
            helm lint "$root" -f "$root/ci/values.yaml"
          done
      - name: Record validation result
        if: always()
        env:
          CHECK_NAME: ${{ matrix.name }}
          CHECK_RESULT: ${{ job.status }}
          LINT_RESULT: ${{ steps.lint.outcome }}
        run: node tools/pipeline/report.mjs validation "$CHECK_NAME" "$CHECK_RESULT" "$LINT_RESULT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: results-validation-${{ strategy.job-index }}
          path: .work/results
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: validation-${{ strategy.job-index }}
          path: |
            .work/validation.log
            **/target/surefire-reports/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  container-validate:
    name: Container source build
    needs: plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Import trusted main cache without exporting PR results
        run: |
          mkdir -p .work
          docker buildx bake --print application | jq '{target: (.target | with_entries(.value = {"cache-from": ["type=gha,scope=application-" + .key]}))}' > .work/cache.json
      - uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4
        with:
          files: |
            docker-bake.hcl
            .work/cache.json
          targets: application
          set: "*.output=type=cacheonly"
      - name: Record container verification
        if: always()
        env: { CHECK_RESULT: "${{ job.status }}" }
        run: node tools/pipeline/report.mjs validation 'Container source build' "$CHECK_RESULT" ''
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: results-container-validation
          path: .work/results
          include-hidden-files: true

  ci:
    name: Validation complete
    needs: [plan, validate, container-validate]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful validation
        env:
          PLAN: ${{ needs.plan.result }}
          VALIDATION: ${{ needs.validate.result }}
          CONTAINERS: ${{ needs.container-validate.result }}
        run: test "$PLAN" = success && test "$VALIDATION" = success && [[ "$CONTAINERS" = success || "$CONTAINERS" = skipped ]]

  publish-images:
    name: Publish complete image set
    needs: [plan, ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write }
    outputs:
      targets: ${{ steps.native.outputs.targets }}
    env:
      REGISTRY: ghcr.io/${{ github.repository }}
      BUILD_TAG: sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      BUILDX_METADATA_PROVENANCE: max
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve native application build and cache scopes
        id: native
        run: |
          mkdir -p .work
          echo "REGISTRY=${REGISTRY,,}" >> "$GITHUB_ENV"
          export REGISTRY="${REGISTRY,,}"
          docker buildx bake --print application > .work/bake.json
          echo "targets=$(jq -c '.group.application.targets' .work/bake.json)" >> "$GITHUB_OUTPUT"
          # Each target has its own Actions cache. Only protected main can export.
          jq '{target: (.target | with_entries(.value = {"cache-from": ["type=gha,scope=application-" + .key], "cache-to": ["type=gha,mode=max,scope=application-" + .key]}))}' .work/bake.json > .work/cache.json
      - uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
        id: build
        with:
          files: |
            docker-bake.hcl
            .work/cache.json
          targets: application
          push: true
          provenance: mode=max
          sbom: true
          set: "*.platform=linux/amd64"
      - name: Record native build outputs immediately
        if: always()
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          printf '%s' "$METADATA" > .work/metadata.json
          node --input-type=module <<'JS'
          import fs from 'node:fs'; import {execFileSync} from 'node:child_process';
          const meta=JSON.parse(fs.readFileSync('.work/metadata.json','utf8') || '{}');
          const bake=JSON.parse(fs.readFileSync('.work/bake.json','utf8'));
          for (const [name, result] of Object.entries(meta)) {
            if (!/^sha256:[a-f0-9]{64}$/.test(result['containerimage.digest'])) continue;
            const image=bake.target[name].tags[0].split(':')[0];
            execFileSync('node',['tools/pipeline/report.mjs','record',name,'image','published',image,'',result['containerimage.digest'],'evidence generation pending'], {stdio:'inherit'});
          }
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-build
          path: |
            .work/bake.json
            .work/metadata.json
          include-hidden-files: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: results-publish-images
          path: .work/results
          include-hidden-files: true
          if-no-files-found: ignore

  image-evidence:
    needs: [ci, publish-images]
    runs-on: ubuntu-24.04
    permissions:
      { contents: write, packages: write, id-token: write, attestations: write }
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.publish-images.outputs.targets) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: native-build, path: .work }
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Read exact native output
        id: image
        env: { TARGET: "${{ matrix.target }}" }
        run: |
          digest=$(jq -er --arg target "$TARGET" '.[$target]["containerimage.digest"]' .work/metadata.json)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          tag=$(jq -er --arg target "$TARGET" '.target[$target].tags[0]' .work/bake.json)
          echo "name=${tag%:*}" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: .work/image.spdx.json
          upload-artifact: false
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: .work/image.spdx.json
          push-to-registry: true
      - uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad
        with: { cosign-release: v3.1.4 }
      - env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.image.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cosign sign --yes "$IMAGE"
          bash tools/pipeline/retain-release.sh "image-${{ matrix.target }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" .work/image.spdx.json
          node tools/pipeline/report.mjs record '${{ matrix.target }}' image published '${{ steps.image.outputs.name }}' '' '${{ steps.image.outputs.digest }}' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/image-${{ matrix.target }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: results-image-evidence-${{ matrix.target }}
          path: .work/results
          include-hidden-files: true
          if-no-files-found: ignore

  publish-chart:
    name: Publish complete candidate; QA pending
    needs: [ci, publish-images, image-evidence]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      { contents: write, packages: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: native-build, path: .work }
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with: { version: v3.18.4 }
      - name: Discover the one native application candidate chart
        run: |
          projects=$(npx nx show projects --with-target=candidate-package --json)
          [[ "$(jq length <<< "$projects")" = 1 ]]
          project=$(jq -r '.[0]' <<< "$projects")
          root=$(npx nx show project "$project" --json | jq -er .root)
          echo "CHART_ROOT=$root" >> "$GITHUB_ENV"
      - name: Bind native outputs and verify trusted image evidence
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          node tools/pipeline/candidate.mjs .work/bake.json .work/metadata.json "$CHART_ROOT/values.yaml" .work/bound
          jq -r '.images[]' .work/bound/build.json | while read -r image; do
            gh attestation verify "oci://$image" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" --source-ref refs/heads/main --source-digest "$GITHUB_SHA"
            gh attestation verify "oci://$image" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --predicate-type https://spdx.dev/Document
          done
          cp .work/bound/values.yaml "$CHART_ROOT/values.yaml"
          cp .work/bound/build.json "$CHART_ROOT/build.json"
          echo "CANDIDATE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}-candidates/$(helm show chart "$CHART_ROOT" | awk '/^name:/ {print $2}')" >> "$GITHUB_ENV"
          # Standard Helm package version, unique for every build attempt.
          VERSION="0.0.$GITHUB_RUN_ID-attempt.$GITHUB_RUN_ATTEMPT" node --input-type=module <<'JS'
          import fs from 'node:fs'; import {parse,stringify} from 'yaml';
          const p=process.env.CHART_ROOT+'/Chart.yaml'; const chart=parse(fs.readFileSync(p,'utf8'));
          chart.version=process.env.VERSION; chart.appVersion=process.env.GITHUB_SHA;
          fs.writeFileSync(p,stringify(chart));
          JS
          helm dependency build --skip-refresh "$CHART_ROOT"
          helm lint "$CHART_ROOT"
          helm template candidate "$CHART_ROOT" > .work/rendered.yaml
          node tools/pipeline/candidate.mjs render .work/rendered.yaml .work/bound/build.json
      - uses: ./.github/actions/publish-chart
        id: candidate
        with:
          project: application-candidate
          chart: ${{ env.CHART_ROOT }}
          registry: ghcr.io/${{ github.repository }}-candidates
          token: ${{ github.token }}
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ${{ env.CANDIDATE_NAME }}
          subject-digest: ${{ steps.candidate.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ env.CANDIDATE_NAME }}
          subject-digest: ${{ steps.candidate.outputs.digest }}
          predicate-type: https://delivery-reference-platform.dev/candidate-build/v1
          predicate-path: .work/bound/build.json
          push-to-registry: true
      - name: Record immutable handoff; no runtime qualification claimed
        env: { REFERENCE: "${{ steps.candidate.outputs.reference }}" }
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          fs.writeFileSync('.work/handoff.json',JSON.stringify({candidate:process.env.REFERENCE,source:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,state:'published',qa:'pending',certification:'pending'},null,2));
          JS
          node tools/pipeline/report.mjs candidate "$REFERENCE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          {
            name: candidate-handoff,
            path: .work/handoff.json,
            include-hidden-files: true,
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: results-publish-chart
          path: .work/results
          include-hidden-files: true
          if-no-files-found: ignore

  report:
    name: Run report
    permissions:
      contents: read
      actions: read
    needs:
      [
        plan,
        validate,
        container-validate,
        ci,
        publish-images,
        image-evidence,
        publish-chart,
      ]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: results-*
          path: .work/results
      - name: Read individual check results and log links
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .work
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100&filter=latest" | jq '{jobs: [.[].jobs[]]}' > .work/jobs.json
      - name: Render actual execution results
        if: always()
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: node tools/pipeline/report.mjs summary --github-summary
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: run-report
          path: |
            .work/run-report.json
            .work/summary.md
          include-hidden-files: true
