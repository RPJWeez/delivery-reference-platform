apiVersion: apps/v1
kind: Deployment
metadata: { name: tide-api }
spec:
  selector: { matchLabels: { app: tide-api } }
  template:
    metadata: { labels: { app: tide-api } }
    spec:
      containers:
        - name: api
          image: { { .Values.application.workloads.api.image | quote } }
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /, port: 8080 } }
---
apiVersion: batch/v1
kind: Job
metadata: { name: tide-drain }
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: drain
          image: { { .Values.application.workloads.drain.image | quote } }
          command: [python, worker.py]
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: tide-sweep }
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: sweep
              image: { { .Values.application.workloads.sweep.image | quote } }
              command: [python, worker.py]
